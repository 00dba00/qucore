# Testne baze za npm run test:core (lokalno i u CI-ju).
#   docker compose -f docker/compose.yml up -d --wait
#   npm run test:db        (seed baze "shop" pa test:core na sve tri)
# Portovi su pomaknuti (15432, 13306, 11433) da ne smetaju lokalno instaliranim bazama.
name: qucore-test
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: studio
    ports: ['15432:5432']
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 2s
      retries: 30
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: studio
      MARIADB_USER: studio
      MARIADB_PASSWORD: studio
      MARIADB_DATABASE: shop
    ports: ['13306:3306']
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 2s
      retries: 30
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: Studio_Passw0rd!
    ports: ['11433:1433']
    healthcheck:
      test: ['CMD-SHELL', "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Studio_Passw0rd!' -Q 'SELECT 1' -b -o /dev/null"]
      interval: 3s
      retries: 40
